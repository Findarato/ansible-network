- hosts: pirate.mcharryville.space
  become: true
  remote_user: ansible
  tasks:
    - name: Start janitor container
      ansible.builtin.include_tasks: tasks/janitor.yml
      tags: janitor
  roles:
    - role: arr/docker-traefik
      tags: [ proxy,traefik ]
    - role: arr/docker-prowlarr
      tags: [ prowlarr, arr ]
    - role: arr/docker-sonarr
      tags: [ sonarr,arr ]
    - role: arr/docker-radarr
      tags: [ radarr,arr ]
    - role: arr/docker-seerr
      tags: [ seerr,arr ]
    # - role: arr/docker-lidarr
    #   tags: [ lidarr,arr ]
    # - role: arr/docker-gluetun
    #   tags: [ vpn,gluetun,arr ]
    - role: arr/docker-deluge
      tags: [ deluge,torrent,arr ]

  post_tasks:
    - name: clean up temp ansible
      ansible.builtin.file:
        path: /tmp/ansible
        state: absent
  vars:
    - ansible_python_interpreter: "/usr/bin/python3"
    - ansible_become_pass: "{{ vault_ansible_remote_user_password }}"
    - arr_docker_network: "tortuga"
    - traefik_arr_domain: 'arr.mcharryville.space'
  vars_files:
    - vars/main.yml
    - vars/main.vault.yml
