- name: Grow the Traefik Proxy Network
  community.docker.docker_network:
    name: traefik_proxy
  tags:
    - uptime-kuma

- name: 'Create directory for container data'
  ansible.builtin.file:
    path: "{{ docker_data_dir }}/{{ dir }}"
    state: 'directory'
    owner: 'docker'
    group: 'docker'
    mode: '0755'
  loop:
    - uptime-kuma_data
  loop_control:
    loop_var: 'dir'
  tags:
    - uptime-kuma


- name: Recreate uptime-kuma container
  community.docker.docker_container:
    name: "{{ uptime_kuma_app_name }}"
    image: "louislam/uptime-kuma:{{ uptime_kuma_release }}"
    state: started
    restart_policy: unless-stopped
    recreate: yes
    restart: yes
    pull: true
    volumes:
      - "{{ docker_data_dir }}/uptime-kuma_data:/app/data"
    labels:
      traefik.enable: "true"
      traefik.http.routers.uptime-kuma.rule: "Host(`{{ uptime_kuma_app_name }}.{{ traefik_domain }}`)"
      traefik.http.routers.uptime-kuma.entrypoints: "websecure"
      traefik.http.routers.uptime-kuma.tls: "true"
      traefik.http.services.uptime-kuma.loadbalancer.server.port: "3001"
    networks_cli_compatible: false
    networks:
      - name: traefik_proxy
        aliases:
          - uptime-kuma.mcharryville.space
          - uptime-kuma
    log_driver: "{{ docker_log_driver }}"
    log_options: "{{ docker_log_options}}"
    env:
      TZ: "America/Chicago"
      UPTIME_KUMA_DB_TYPE: "mariadb"
      UPTIME_KUMA_DB_NAME: "{{ uptime_kuma_db_name }}"
      UPTIME_KUMA_DB_HOSTNAME: "{{ uptime_kuma_db_hostname }}"
      UPTIME_KUMA_DB_PORT: "{{ uptime_kuma_db_port }}"
      UPTIME_KUMA_DB_USERNAME: "{{ uptime_kuma_db_username }}"
      UPTIME_KUMA_DB_PASSWORD: "{{ uptime_kuma_db_password }}"
    dns_search_domains: "{{ dns_domains }}"
    dns_servers: "{{ dns_servers }}"
  tags:
    - uptime-kuma
