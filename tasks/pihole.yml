- name: Grow the Traefik Proxy Network
  community.docker.docker_network:
    name: traefik_proxy
  tags:
    - pihole

- name: 'Create directory for container data'
  ansible.builtin.file:
    path: "{{ docker_data_dir }}/{{ dir }}"
    state: 'directory'
    owner: 'docker'
    group: 'docker'
    mode: '0755'
  loop:
    - pihole_data
    - pihole_data/etc
    - pihole_data/dnsmasq.d
  loop_control:
    loop_var: 'dir'
  tags:
    - pihole

- name: Recreate pihole container
  community.docker.docker_container:
    name: pihole
    hostname: pihole
    image: twinproduction/pihole
    state: started
    restart_policy: unless-stopped
    recreate: yes
    restart: yes
    pull: true
    shm_size: 500MB
    labels:
      traefik.enable: "true"
      traefik.http.routers.pihole.rule: "Host(`pihole02.{{ traefik_domain }}`)"
      traefik.http.routers.pihole.entrypoints: websecure
      traefik.http.routers.pihole.tls: "true"
      traefik.http.services.pihole.loadbalancer.server.port: "80"
    volumes:
      - "{{docker_data_dir}}/pihole_data/etc:/etc/pihole/"
      - "{{docker_data_dir}}/pihole_data/dnsmasq.d:/etc/dnsmasq.d/"
    networks_cli_compatible: false
    networks:
      - name: traefik_proxy
    log_driver: "{{ docker_log_driver }}"
    log_options: "{{ docker_log_options}}"
    env:
      TZ: "America/Chicago"
  tags:
    - pihole

...