# https://github.com/DartSteven/Nutify

- name: Grow the Traefik Proxy Network
  community.docker.docker_network:
    name: traefik_proxy
  tags:
    - nutify

- name: 'Create directory for container data'
  ansible.builtin.file:
    path: "{{ docker_data_dir }}/{{ dir }}"
    state: 'directory'
    owner: 'docker'
    group: 'docker'
    mode: '0755'
  loop:
    - nutify_data
    - nutify_data/logs
    - nutify_data/instance
    - nutify_data/ssl
    - nutify_data/etc/nut



#       - ./Nutify/logs:/app/nutify/logs
#       - ./Nutify/instance:/app/nutify/instance
#       - ./Nutify/ssl:/app/ssl
#       - ./Nutify/etc/nut:/etc/nut
  loop_control:
    loop_var: 'dir'
  tags:
    - nutify

- name: Recreate nutify container
  community.docker.docker_container:
    name: nutify
    hostname: nutify
    image: dartsteven/nutify:latest-amd64
    state: started
    restart_policy: unless-stopped
    recreate: yes
    restart: yes
    pull: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    device_cgroup_rules:
      - "c 189:* rwm"
    labels:
      traefik.enable: "true"
      traefik.http.routers.nutify.rule: "Host(`nutify.{{ traefik_domain }}`)"
      traefik.http.routers.nutify.entrypoints: websecure
      traefik.http.routers.nutify.tls: "true"
      traefik.http.services.nutify.loadbalancer.server.port: "443"
    volumes:
      - "{{docker_data_dir}}/nutify_data/logs:/app/nutify/logs"
      - "{{docker_data_dir}}/nutify_data/instance:/app/nutify/instance"
      - "{{docker_data_dir}}/nutify_data/ssl:/app/ssl"
      - "{{docker_data_dir}}/nutify_data/etc/nut:/etc/nut"
      - "/dev/bus/usb:/dev/bus/usb:rw"
      - "/run/udev:/run/udev:ro"
    networks_cli_compatible: false
    networks:
      - name: traefik_proxy
    log_driver: "{{ docker_log_driver }}"
    log_options: "{{ docker_log_options}}"
    env:
      TZ: "America/Chicago"
      nutify_CONFIG_PATH: "/config"
  tags:
    - nutify



