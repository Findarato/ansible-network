---

- hosts: rpi-utility.mcharryville.space
  become: true
  remote_user: joe
  roles:
      - role: basic-server
        tags: [ setup, basic-server ]
      - role: docker_traefik
        tags: [ proxy, traefik ]
  tasks:
    - name: Start Pi-Hole Container
      ansible.builtin.include_tasks: tasks/pihole.yml
      tags: [ pihole ]
  vars_files:
    - vars/main.yml
    - vars/main.vault.yml
  tags:
    - rpi
